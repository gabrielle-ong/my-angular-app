<div class="form-container">
  <h1>Order Delivery Form</h1>
  
  <form class="delivery-form">
    <ui-input
      label="Customer Name"
      placeholder="Enter your name"
      [(value)]="customerName"
      type="text"
    ></ui-input>

    <ui-input
      label="Phone Number"
      placeholder="Enter phone number"
      [(value)]="phoneNumber"
      type="tel"
    ></ui-input>

    <ui-input
      label="Delivery Address"
      placeholder="Enter delivery address"
      [(value)]="deliveryAddress"
      type="textarea"
      [rows]="3"
    ></ui-input>

    <ui-date-picker
      label="Delivery Date"
      [(value)]="deliveryDate"
    ></ui-date-picker>

    <ui-radio-group
      label="Preferred Delivery Time"
      [(value)]="deliveryTime"
      [options]="[
        { value: 'morning', label: 'Morning (9 AM - 12 PM)' },
        { value: 'afternoon', label: 'Afternoon (12 PM - 5 PM)' },
        { value: 'evening', label: 'Evening (5 PM - 8 PM)' },
        { value: 'anytime', label: 'Anytime' }
      ]"
    ></ui-radio-group>

    <ui-radio-group
      label="Payment Method"
      [(value)]="paymentMethod"
      [options]="[
        { value: 'card', label: 'Credit/Debit Card' },
        { value: 'cash', label: 'Cash on Delivery' },
        { value: 'paypal', label: 'PayPal' }
      ]"
    ></ui-radio-group>

    <div class="checkbox-group">
      <label class="checkbox-label">Special Instructions</label>
      <div class="checkbox-options">
        <ui-checkbox
          label="Handle with care - Fragile items"
          [(checked)]="fragileItems"
        ></ui-checkbox>
        <ui-checkbox
          label="Gift wrapping requested"
          [(checked)]="giftWrap"
        ></ui-checkbox>
        <ui-checkbox
          label="Require signature upon delivery"
          [(checked)]="requireSignature"
        ></ui-checkbox>
      </div>
    </div>

    <div class="switch-group">
      <ui-toggle
        label="Leave at doorway"
        [(checked)]="leaveAtDoorway"
      ></ui-toggle>
    </div>

    <ui-button
      label="Submit Order"
      type="raised"
      color="primary"
      buttonType="submit"
      class="submit-button"
    ></ui-button>
  </form>
</div>
